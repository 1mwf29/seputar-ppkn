<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seputar PPKn - Media Pembelajaran Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .card-menu {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-menu:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-start max-w-md mx-auto bg-slate-50 border-x border-slate-200 shadow-xl">

    <!-- TOP HEADER -->
    <header class="p-4 flex justify-between items-center bg-white sticky top-0 z-40 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <img src="Seputar PPKn.jpg" alt="Logo Seputar PPKn" class="w-9 h-9 rounded-xl object-cover shadow-md">
            </div>
            <div>
                <h1 class="font-bold text-base text-slate-800 leading-tight">Seputar PPKn</h1>
                <p class="text-[10px] text-slate-400">Media Pembelajaran Digital</p>
            </div>
        </div>
        <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 text-sm">
            <i class="fa-solid fa-bell"></i>
        </div>
    </header>

    <main class="p-4 space-y-4">

       <!-- PROFILE BANNER / CARD PROFIL -->
<div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-4 text-white shadow-lg shadow-blue-500/20 relative overflow-hidden">
    <!-- flex-row & items-center bikin foto & teks sejajar ke samping -->
    <div class="flex flex-row items-center gap-3.5 relative z-10">
        
        <!-- FOTO PROFIL (Tetap lingkaran, tidak melar) -->
        <img src="nando.jpeg" alt="I Made Wibi Fernanda" class="w-14 h-14 rounded-full object-cover border-2 border-white/40 shadow-md shrink-0">
        
        <!-- TEKS IDENTITAS (Berada tepat di samping kanan foto) -->
        <div class="flex flex-col justify-center min-w-0">
            <div>
                <span class="inline-block text-[9px] uppercase font-bold tracking-wider text-blue-200 bg-blue-500/30 px-2 py-0.5 rounded-md border border-blue-400/20">
                    Educator & Creator
                </span>
            </div>
            <h2 class="font-extrabold text-sm md:text-base leading-tight mt-1 text-white truncate">
                I Made Wibi Fernanda, S.Pd.
            </h2>
            <p class="text-[10.5px] text-blue-100 mt-0.5 leading-snug">
                Guru Pendidikan Pancasila — SMPN 17 Denpasar
            </p>
        </div>

    </div>

    <!-- Hiasan Background Card -->
    <div class="absolute -right-4 -bottom-6 text-7xl opacity-10 select-none">
        🏛️
    </div>
</div>

        <!-- GRID 9 MENU UTUH -->
        <div>
            <div class="grid grid-cols-3 gap-3">
                
                <!-- MENU 1: E-BOOK -->
                <div onclick="openTab('ebook')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">E-Book</span>
                </div>

                <!-- MENU 2: PPT -->
                <div onclick="openTab('ppt')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-file-powerpoint"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Slide PPT</span>
                </div>

                <!-- MENU 3: PERPUSTAKAAN -->
                <div onclick="openTab('perpus')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-landmark"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Perpus</span>
                </div>

                <!-- MENU 4: KUIS -->
                <div onclick="openTab('kuis')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-circle-question"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Kuis Soal</span>
                </div>

                <!-- MENU 5: UUD 1945 -->
                <div onclick="openTab('uud')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-indigo-50 text-indigo-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-scale-balanced"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">UUD 1945</span>
                </div>

                <!-- MENU 6: VIDEO -->
                <div onclick="openTab('video')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-red-50 text-red-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Video</span>
                </div>

                <!-- MENU 7: KONTAK PERSON -->
                <div onclick="openTab('kontak')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-teal-50 text-teal-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-address-book"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Kontak</span>
                </div>

                <!-- MENU 8: SARAN DAN KRITIK -->
                <div onclick="openTab('saran')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-comment-dots"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Saran & Kritik</span>
                </div>

                <!-- MENU 9: MEDIA SOSIAL -->
                <div onclick="openTab('medsos')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-sky-50 text-sky-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Media Sosial</span>
                </div>

            </div>
        </div>

        <!-- POPUP / MODAL ISI CONTENT -->
        <div id="content-modal" class="hidden bg-white p-4 rounded-2xl border border-slate-200 shadow-md">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-3">
                <h4 id="modal-title" class="font-bold text-sm text-slate-800 flex items-center gap-2"></h4>
                <button onclick="closeModal()" class="text-slate-400 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body" class="space-y-2"></div>
        </div>

    </main>

    <!-- BOTTOM NAVBAR -->
    <footer class="bg-white border-t border-slate-200 p-2 flex justify-around items-center sticky bottom-0 z-40 text-[11px]">
        <button class="flex flex-col items-center text-blue-600 font-semibold gap-1">
            <i class="fa-solid fa-house text-base"></i>
            <span>Beranda</span>
        </button>
        <button onclick="openTab('ebook')" class="flex flex-col items-center text-slate-400 gap-1">
            <i class="fa-solid fa-book text-base"></i>
            <span>Materi</span>
        </button>
        <button onclick="openTab('saran')" class="flex flex-col items-center text-slate-400 gap-1">
            <i class="fa-solid fa-comments text-base"></i>
            <span>Aspirasi</span>
        </button>
    </footer>

    <script>
        function openTab(menu) {
            const modal = document.getElementById('content-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            modal.classList.remove('hidden');

            if (menu === 'ebook') {
                title.innerHTML = `<i class="fa-solid fa-book-bookmark text-emerald-500"></i> E-Book & Modul Ajar`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Buku Siswa PPKn Kelas 7</p>
                            <span class="text-[10px] text-slate-400">PDF • Kurikulum Merdeka</span>
                        </div>
                        <a href="#" class="bg-blue-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Buka</a>
                    </div>
                `;
            } else if (menu === 'ppt') {
                title.innerHTML = `<i class="fa-solid fa-file-powerpoint text-amber-500"></i> Slide Presentasi`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">PPT Bab 1: Sejarah Pancasila</p>
                            <span class="text-[10px] text-slate-400">Google Slides</span>
                        </div>
                        <a href="#" class="bg-amber-500 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Lihat</a>
                    </div>
                `;
            } else if (menu === 'perpus') {
                title.innerHTML = `<i class="fa-solid fa-landmark text-blue-500"></i> Perpustakaan Digital`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Sejarah Rumusan Pancasila</p>
                            <span class="text-[10px] text-slate-400">Artikel Sejarah</span>
                        </div>
                        <a href="#" class="bg-blue-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Baca</a>
                    </div>
                `;
            } else if (menu === 'kuis') {
                title.innerHTML = `<i class="fa-solid fa-circle-question text-rose-500"></i> Kuis & Evaluasi`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Latihan Soal Bab 1</p>
                            <span class="text-[10px] text-slate-400">10 Soal Pilihan Ganda</span>
                        </div>
                        <a href="#" class="bg-rose-500 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Mulai</a>
                    </div>
                `;
            } else if (menu === 'uud') {
                title.innerHTML = `<i class="fa-solid fa-scale-balanced text-indigo-500"></i> Naskah UUD 1945`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">UUD NRI Tahun 1945 Lengkap</p>
                            <span class="text-[10px] text-slate-400">Pembukaan & Pasal-pasal</span>
                        </div>
                        <a href="#" class="bg-indigo-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Buka</a>
                    </div>
                `;
            } else if (menu === 'video') {
                title.innerHTML = `<i class="fa-solid fa-play text-red-500"></i> Video Pembelajaran`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Video Lahirnya Pancasila</p>
                            <span class="text-[10px] text-slate-400">YouTube Video</span>
                        </div>
                        <a href="#" class="bg-red-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Tonton</a>
                    </div>
                `;
            } else if (menu === 'kontak') {
                title.innerHTML = `<i class="fa-solid fa-address-book text-teal-500"></i> Kontak Person Guru`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">WhatsApp Guru</p>
                            <span class="text-[10px] text-slate-400">Layanan Pertanyaan Siswa</span>
                        </div>
                        <a href="#" class="bg-teal-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Hubungi</a>
                    </div>
                `;
            } else if (menu === 'saran') {
                title.innerHTML = `<i class="fa-solid fa-comment-dots text-purple-500"></i> Saran dan Kritik`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Kotak Aspirasi Digital</p>
                            <span class="text-[10px] text-slate-400">Masukan untuk Pembelajaran</span>
                        </div>
                        <a href="#" class="bg-purple-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Isi Form</a>
                    </div>
                `;
            } else if (menu === 'medsos') {
                title.innerHTML = `<i class="fa-solid fa-share-nodes text-sky-500"></i> Media Sosial Pembelajaran`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">YouTube Seputar PPKn</p>
                            <span class="text-[10px] text-slate-400">Channel Edukasi</span>
                        </div>
                        <a href="#" class="bg-red-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Kunjungi</a>
                    </div>
                `;
            }

            modal.scrollIntoView({ behavior: 'smooth' });
        }

        function closeModal() {
            document.getElementById('content-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
