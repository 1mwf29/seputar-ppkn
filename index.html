<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Pembelajaran PPKn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .card-menu {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-menu:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between max-w-md mx-auto bg-slate-50 border-x border-slate-200 shadow-xl">

    <!-- TOP HEADER -->
    <header class="p-4 flex justify-between items-center bg-white sticky top-0 z-40 border-b border-slate-100">
        <div class="flex items-center gap-3">
            <button class="text-slate-600 text-lg">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="font-bold text-lg text-slate-800">Media PPKn</h1>
        </div>
        <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-sm font-bold">
            <i class="fa-solid fa-bell"></i>
        </div>
    </header>

    <main class="p-4 flex-1 space-y-6">

        <!-- PROFILE BANNER / CARD (Gaya Aplikasi Sekolah) -->
        <div class="bg-blue-600 rounded-2xl p-4 text-white shadow-lg shadow-blue-500/20 relative overflow-hidden">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl border border-white/30">
                    🏛️
                </div>
                <div>
                    <h2 class="font-bold text-base leading-tight">Pendidikan Pancasila</h2>
                    <p class="text-xs text-blue-100">Portal Belajar Siswa</p>
                </div>
            </div>
            
            <div class="bg-blue-700/50 rounded-xl p-2.5 flex justify-between items-center text-xs border border-blue-400/30">
                <div>
                    <span class="text-blue-200 block text-[10px]">Tahun Ajaran</span>
                    <span class="font-semibold">2026 / 2027</span>
                </div>
                <div class="text-right">
                    <span class="text-blue-200 block text-[10px]">Status Portal</span>
                    <span class="font-semibold text-emerald-300">● Aktif</span>
                </div>
            </div>
        </div>

        <!-- SECTION 1: MATERI UTAMA -->
        <div>
            <h3 class="text-sm font-bold text-slate-500 mb-3 uppercase tracking-wider text-[11px]">Materi Pembelajaran</h3>
            <div class="grid grid-cols-3 gap-3">
                
                <!-- MENU 1: E-BOOK -->
                <div onclick="openTab('ebook')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">E-Book</span>
                </div>

                <!-- MENU 2: PPT -->
                <div onclick="openTab('ppt')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-file-powerpoint"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Slide PPT</span>
                </div>

                <!-- MENU 3: PERPUSTAKAAN -->
                <div onclick="openTab('perpus')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-landmark"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Perpus</span>
                </div>

            </div>
        </div>

        <!-- SECTION 2: EVALUASI & AKADEMIK -->
        <div>
            <h3 class="text-sm font-bold text-slate-500 mb-3 uppercase tracking-wider text-[11px]">Latihan & Referensi</h3>
            <div class="grid grid-cols-3 gap-3">
                
                <!-- MENU 4: KUIS -->
                <div onclick="openTab('kuis')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-circle-question"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Kuis Soal</span>
                </div>

                <!-- MENU 5: UUD 1945 -->
                <div onclick="openTab('uud')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-indigo-50 text-indigo-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-scale-balanced"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">UUD 1945</span>
                </div>

                <!-- MENU 6: VIDEO -->
                <div onclick="openTab('video')" class="card-menu bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm text-center cursor-pointer flex flex-col items-center justify-center gap-2">
                    <div class="w-11 h-11 bg-red-50 text-red-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Video</span>
                </div>

            </div>
        </div>

        <!-- POPUP / MODAL ISI CONTENT -->
        <div id="content-modal" class="hidden bg-white p-4 rounded-2xl border border-slate-200 shadow-md">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-3">
                <h4 id="modal-title" class="font-bold text-sm text-slate-800 flex items-center gap-2"></h4>
                <button onclick="closeModal()" class="text-slate-400 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body" class="space-y-2"></div>
        </div>

    </main>

    <!-- BOTTOM NAVBAR -->
    <footer class="bg-white border-t border-slate-200 p-2 flex justify-around items-center sticky bottom-0 z-40 text-[11px]">
        <button class="flex flex-col items-center text-blue-600 font-semibold gap-1">
            <i class="fa-solid fa-house text-base"></i>
            <span>Beranda</span>
        </button>
        <button onclick="openTab('ebook')" class="flex flex-col items-center text-slate-400 gap-1">
            <i class="fa-solid fa-book text-base"></i>
            <span>Materi</span>
        </button>
        <button onclick="openTab('kuis')" class="flex flex-col items-center text-slate-400 gap-1">
            <i class="fa-solid fa-pen-to-square text-base"></i>
            <span>Tugas</span>
        </button>
    </footer>

    <script>
        function openTab(menu) {
            const modal = document.getElementById('content-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            modal.classList.remove('hidden');

            if (menu === 'ebook') {
                title.innerHTML = `<i class="fa-solid fa-book-bookmark text-emerald-500"></i> E-Book & Modul Ajar`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Buku Siswa PPKn Kelas 7</p>
                            <span class="text-[10px] text-slate-400">PDF • Kurikulum Merdeka</span>
                        </div>
                        <a href="#" class="bg-blue-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Buka</a>
                    </div>
                `;
            } else if (menu === 'ppt') {
                title.innerHTML = `<i class="fa-solid fa-file-powerpoint text-amber-500"></i> Slide Presentasi`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">PPT Bab 1: Sejarah Pancasila</p>
                            <span class="text-[10px] text-slate-400">Google Slides</span>
                        </div>
                        <a href="#" class="bg-amber-500 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Lihat</a>
                    </div>
                `;
            } else if (menu === 'perpus') {
                title.innerHTML = `<i class="fa-solid fa-landmark text-blue-500"></i> Perpustakaan Digital`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Sejarah Rumusan Pancasila</p>
                            <span class="text-[10px] text-slate-400">Artikel Sejarah</span>
                        </div>
                        <a href="#" class="bg-blue-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Baca</a>
                    </div>
                `;
            } else if (menu === 'kuis') {
                title.innerHTML = `<i class="fa-solid fa-circle-question text-rose-500"></i> Kuis & Evaluasi`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Latihan Soal Bab 1</p>
                            <span class="text-[10px] text-slate-400">10 Soal Pilihan Ganda</span>
                        </div>
                        <a href="#" class="bg-rose-500 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Mulai</a>
                    </div>
                `;
            } else if (menu === 'uud') {
                title.innerHTML = `<i class="fa-solid fa-scale-balanced text-indigo-500"></i> Naskah UUD 1945`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">UUD NRI Tahun 1945 Lengkap</p>
                            <span class="text-[10px] text-slate-400">Pembukaan & Pasal-pasal</span>
                        </div>
                        <a href="#" class="bg-indigo-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Buka</a>
                    </div>
                `;
            } else if (menu === 'video') {
                title.innerHTML = `<i class="fa-solid fa-play text-red-500"></i> Video Pembelajaran`;
                body.innerHTML = `
                    <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                        <div>
                            <p class="font-bold text-xs text-slate-800">Video Lahirnya Pancasila</p>
                            <span class="text-[10px] text-slate-400">YouTube Video</span>
                        </div>
                        <a href="#" class="bg-red-600 text-white text-[11px] px-3 py-1.5 rounded-lg font-semibold">Tonton</a>
                    </div>
                `;
            }

            modal.scrollIntoView({ behavior: 'smooth' });
        }

        function closeModal() {
            document.getElementById('content-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
